<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturno — Roteiros</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="img/logo.png" alt="Saturno" class="brand-logo">
      <div><h1>Saturno</h1><div class="sub">Logística Inteligente</div></div>
    </div>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro-motorista.html">Motoristas</a>
    <a href="cadastro-roteiro.html">Roteiros</a>
    <a href="cadastro-ponto.html">Pontos</a>
    <a href="registrar-ponto.html">Registrar Ponto</a>
  </nav>
  <main>
    <div class="card">
      <h2>Novo roteiro</h2>
      <div id="alerta" class="alerta" style="display:none;"></div>
      <form id="form-roteiro">
        <label for="data">Data do roteiro *</label>
        <input type="date" id="data" required>
        <label for="motorista_id">Motorista responsável *</label>
        <select id="motorista_id" required></select>
        <label for="distancia_total_km">Distância total (km)</label>
        <input type="number" id="distancia_total_km" step="0.1" min="0" placeholder="Ex.: 42.5">
        <div class="acoes">
          <button type="submit" class="btn btn-primary">Criar roteiro</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Roteiros cadastrados</h2>
      <table id="tabela-roteiros">
        <thead><tr><th>Data</th><th>Motorista</th><th>Distância</th><th>Pontos</th><th>Tempo parado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="vazio-roteiros" style="color:#666; font-size:.9rem; display:none;">Nenhum roteiro cadastrado ainda.</p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/roteiro.js"></script>
</body>
</html>
