<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturno — Histórico</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="img/logo.png" alt="Saturno" class="brand-logo">
      <div><h1>Saturno</h1><div class="sub">Logística Inteligente</div></div>
    </div>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro-motorista.html">Motoristas</a>
    <a href="cadastro-roteiro.html">Roteiros</a>
    <a href="cadastro-ponto.html">Pontos</a>
    <a href="registrar-ponto.html">Registrar Ponto</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="parametros.html">Parâmetros</a>
    <a href="historico.html">Histórico</a>
  </nav>
  <main>
    <div class="card">
      <h2>📈 Histórico de rotas</h2>

      <div class="filtros">
        <div class="campo">
          <label for="inicio">De</label>
          <input type="date" id="inicio">
        </div>
        <div class="campo">
          <label for="fim">Até</label>
          <input type="date" id="fim">
        </div>
        <div class="campo">
          <label for="motorista_id">Motorista</label>
          <select id="motorista_id"><option value="">Todos</option></select>
        </div>
        <div class="acoes" style="margin:0;">
          <button type="button" class="btn btn-primary" onclick="carregarHistorico()">Filtrar</button>
          <button type="button" class="btn btn-sec" onclick="exportarCsv()">Exportar CSV</button>
        </div>
      </div>

      <table id="tabela-historico">
        <thead>
          <tr>
            <th>Roteiro</th><th>Motorista</th><th>Data</th>
            <th>Tempo parado</th><th>Custo</th><th>Jornada</th><th>Extras</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="vazio-historico" class="estado-vazio" style="display:none;">Nenhum roteiro encontrado para o filtro atual.</p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
