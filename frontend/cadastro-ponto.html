<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturno — Pontos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="img/logo.png" alt="Saturno" class="brand-logo">
      <div><h1>Saturno</h1><div class="sub">Logística Inteligente</div></div>
    </div>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro-motorista.html">Motoristas</a>
    <a href="cadastro-roteiro.html">Roteiros</a>
    <a href="cadastro-ponto.html">Pontos</a>
    <a href="registrar-ponto.html">Registrar Ponto</a>
  </nav>
  <main>
    <div class="card">
      <h2>Novo ponto</h2>
      <div id="alerta" class="alerta" style="display:none;"></div>

      <form id="form-ponto">
        <label for="roteiro_id">Roteiro *</label>
        <select id="roteiro_id" required></select>

        <label for="endereco">Endereço *</label>
        <input type="text" id="endereco" required placeholder="Ex.: Rua Peru, 55">

        <div style="display:flex; gap:10px; align-items:flex-end; margin-top:6px;">
          <div style="flex:1;">
            <label for="latitude">Latitude</label>
            <input type="number" id="latitude" step="any" placeholder="-19.9245">
          </div>
          <div style="flex:1;">
            <label for="longitude">Longitude</label>
            <input type="number" id="longitude" step="any" placeholder="-43.9352">
          </div>
        </div>

        <div class="acoes" style="margin-top:8px;">
          <button type="button" class="btn btn-sec" id="btn-geo">
            📍 Usar minha localização
          </button>
          <span id="geo-status" style="font-size:.82rem; color:var(--text-muted); align-self:center;"></span>
        </div>

        <p style="font-size:.82rem;color:#666;margin-top:14px;">
          ℹ️ A ordem do ponto é definida automaticamente (1 = partida, 2, 3...).<br>
          O ponto de partida (ordem 1) não acumula tempo parado (RN01).
        </p>

        <div class="acoes">
          <button type="submit" class="btn btn-primary">Adicionar ponto</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Filtrar pontos por roteiro</h2>
      <label for="filtro-roteiro">Roteiro</label>
      <select id="filtro-roteiro"></select>
      <div id="lista-pontos" style="margin-top:14px;"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ponto.js"></script>
</body>
</html>
