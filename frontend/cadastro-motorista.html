<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturno — Motoristas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="img/logo.png" alt="Saturno" class="brand-logo">
      <div><h1>Saturno</h1><div class="sub">Logística Inteligente</div></div>
    </div>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro-motorista.html">Motoristas</a>
    <a href="cadastro-roteiro.html">Roteiros</a>
    <a href="cadastro-ponto.html">Pontos</a>
    <a href="registrar-ponto.html">Registrar Ponto</a>
  </nav>
  <main>
    <div class="card">
      <h2>Novo motorista / motoboy</h2>
      <div id="alerta" class="alerta" style="display:none;"></div>
      <form id="form-motorista">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" required>
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="(31) 99999-0000">
        <label for="documento">Documento (CPF/CNH)</label>
        <input type="text" id="documento">
        <label for="veiculo">Veículo</label>
        <input type="text" id="veiculo" placeholder="Ex.: CG 160 Titan">
        <label for="rendimento_km_l">Rendimento (km/litro)</label>
        <input type="number" id="rendimento_km_l" step="0.1" min="0" placeholder="Ex.: 35">
        <div class="acoes">
          <button type="submit" class="btn btn-primary">Salvar motorista</button>
          <button type="button" class="btn btn-sec" onclick="limparFormulario()">Limpar</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Motoristas cadastrados</h2>
      <table id="tabela-motoristas">
        <thead><tr><th>Nome</th><th>Telefone</th><th>Documento</th><th>Veículo</th><th>km/l</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="vazio-motoristas" style="color:#666; font-size:.9rem; display:none;">Nenhum motorista cadastrado ainda.</p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/motorista.js"></script>
</body>
</html>
